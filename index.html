<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script data-goatcounter="https://bear0945.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的遊戲書櫃 | Personal Game Bookshelf</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       完全還原草圖配色的房間與書櫃樣式 (零外部圖片)
       ========================================== */
    :root {
      --wall-color: #f7c594;       /* 溫暖杏桃色牆面 */
      --trim-top: #522927;         /* 踢腳板上緣深褐 */
      --trim-body: #783a37;        /* 踢腳板主體紅褐 */
      --floor-color: #f5b0b6;      /* 粉紅地板 */
      --cabinet-frame: #381005;    /* 書櫃深咖啡色外框與層板 */
      --cabinet-inner: #7d4406;    /* 書櫃內部棕色背板 */
      --callout-border: #bdbdbd;   /* 說明框與引出線的灰色 */
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--wall-color);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      user-select: none;
    }

    /* 房間背景結構：牆面、踢腳板、地板 */
    .room-scene {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .wall-baseboard {
      width: 100%;
      height: 110px;
      background-color: var(--trim-body);
      border-top: 22px solid var(--trim-top);
      position: absolute;
      bottom: 65px;
      left: 0;
      z-index: 1;
    }

    .room-floor {
      width: 100%;
      height: 65px;
      background-color: var(--floor-color);
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 1;
    }

    /* 整合時鐘、開關、茶几與書櫃的固定比例舞台，窄螢幕時整體一起等比例縮放，絕不重疊 */
    .furniture-stage {
      position: relative;
      width: 500px;
      height: 600px;
      margin-bottom: 50px; /* 穩穩站在粉紅地板上 */
      z-index: 20;
      transform-origin: bottom center;
      flex-shrink: 0;
    }

    /* 書櫃主體結構：固定在舞台右側 */
    .bookcase {
      position: absolute;
      right: 10px;
      bottom: 0;
      z-index: 10;
      width: 340px;
      background-color: var(--cabinet-frame);
      padding: 14px 14px 12px 14px;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.28);
      border-radius: 2px;
    }

    /* 每一層書架格 */
    .shelf-row {
      background-color: var(--cabinet-inner);
      height: 118px;
      margin-bottom: 14px;
      padding: 0 8px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 4px;
      position: relative;
      box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden; /* 防止任何子元素意外超出內框 */
    }

    .shelf-row:last-child {
      margin-bottom: 0;
    }

    /* 書櫃右側邊緣的小木栓裝飾 (還原草圖細節) */
    .cabinet-peg {
      position: absolute;
      right: -4px;
      width: 5px;
      height: 10px;
      background-color: var(--cabinet-frame);
      border-radius: 0 4px 4px 0;
    }

    /* 一套書 (代表一個遊戲，本身就是超連結) */
    .book-set {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      position: relative;
      padding-top: 6px;
      min-width: 0;
    }

    .book-set:hover,
    .book-set.active-touch {
      transform: translateY(-8px);
      filter: brightness(1.08) drop-shadow(0 6px 8px rgba(0,0,0,0.4));
      z-index: 20;
    }

    /* 單本書脊樣式 */
    .book-spine {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 1;
      border: 1px solid rgba(0, 0, 0, 0.25);
      border-bottom: none;
      box-shadow: inset 2px 0 3px rgba(255, 255, 255, 0.18), inset -2px 0 4px rgba(0, 0, 0, 0.2);
      border-radius: 2px 2px 0 0;
    }

    /* 書背上的白色標籤 (粗款與細線款) */
    .spine-label-thick {
      width: 42%;
      height: 58%;
      background-color: #ffffff;
      border-radius: 1px;
    }

    .spine-label-thin {
      width: 3px;
      height: 68%;
      background-color: #ffffff;
      border-radius: 1px;
    }

    /* 盆栽與泰迪熊搖晃動畫 */
    @keyframes flowerWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg) scale(1.06); }
      50% { transform: rotate(7deg) scale(1.06); }
      75% { transform: rotate(-4deg); }
    }

    .decor-item {
      cursor: pointer;
      transform-origin: bottom center;
      transition: transform 0.2s ease;
    }

    .decor-item:hover {
      transform: scale(1.06);
    }

    .wiggling {
      animation: flowerWiggle 0.55s ease-in-out;
    }

    /* 熱可可飄煙動畫 */
    @keyframes steamFloat {
      0%, 100% { transform: translateY(0) scaleY(1); opacity: 0.7; }
      50% { transform: translateY(-4px) scaleY(1.15); opacity: 0.25; }
    }
    .steam-line {
      animation: steamFloat 2.4s ease-in-out infinite;
    }
    .steam-line-delay {
      animation: steamFloat 2.4s ease-in-out 1.2s infinite;
    }

    /* 小貓尾巴搖擺動畫 */
    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    .cat-tail {
      transform-origin: 94px 60px;
      animation: tailWag 3.2s ease-in-out infinite;
    }

    /* 牆壁指針時鐘 (固定於舞台左上方，與書櫃保持安全距離) */
    .wall-clock {
      position: absolute;
      left: 26px;
      bottom: 390px;
      z-index: 36;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background-color: #fffdf8;
      border: 5px solid var(--cabinet-frame);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2), inset 0 2px 5px rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .wall-clock:hover {
      transform: scale(1.06);
    }

    /* 牆壁電燈開關 (固定於時鐘正下方) */
    .wall-switch {
      position: absolute;
      left: 45px;
      bottom: 295px;
      z-index: 38;
      width: 36px;
      height: 54px;
      background-color: #fffdf9;
      border: 3px solid #d6c5b3;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .wall-switch:active {
      transform: scale(0.94);
    }

    /* 「円」字型小茶几與馬克杯組合 (固定於開關正下方、書櫃左側) */
    .side-table-group {
      position: absolute;
      left: 4px;
      bottom: 0;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: bottom left;
    }

    /* 關燈模式的聚光燈遮罩 */
    #darkRoomOverlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 35;
      background: radial-gradient(circle at 50% 62%, rgba(15, 10, 5, 0.12) 0%, rgba(12, 8, 5, 0.78) 58%, rgba(5, 3, 2, 0.92) 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    body.lights-off #darkRoomOverlay {
      opacity: 1;
    }
    .switch-rocker {
      width: 14px;
      height: 24px;
      background-color: #f0e6d8;
      border: 1.5px solid #b8a590;
      border-radius: 2px;
      position: relative;
      box-shadow: inset 0 -3px 2px rgba(0,0,0,0.15);
      transition: all 0.15s ease;
    }
    body.lights-off .switch-rocker {
      background-color: #e3d5c3;
      box-shadow: inset 0 3px 2px rgba(0,0,0,0.2);
    }

    /* 右側說明白框：改為絕對定位/懸浮顯示，完全不推擠書櫃高度 */
    .callout-card {
      background-color: #ffffff;
      border: 5px solid var(--callout-border);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 30;
      pointer-events: none; /* 滑鼠移開書本即消失，不擋點擊 */
    }

    .callout-hidden {
      opacity: 0;
      transform: translateY(4px);
    }

    .callout-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .callout-divider {
      height: 5px;
      background-color: var(--callout-border);
      border-radius: 999px;
      width: 82%;
      margin: 6px auto 12px auto;
    }

    /* 動態引出折線 SVG 畫布 */
    #leaderLineSvg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 25;
      transition: opacity 0.18s ease;
    }
  </style>
</head>
<body>

  <!-- 全螢幕動態 SVG：負責畫出草圖中的「灰色 Z 字型引出線」 -->
  <svg id="leaderLineSvg" class="opacity-0">
    <polyline id="leaderPolyline" 
              fill="none" 
              stroke="#bdbdbd" 
              stroke-width="4.5" 
              stroke-linecap="square"
              stroke-linejoin="miter"
              points="" />
    <!-- 起點小圓點 -->
    <circle id="leaderStartDot" cx="-20" cy="-20" r="4" fill="#bdbdbd" />
  </svg>

  <!-- 頂部簡潔小提示與音效按鈕 -->
  <header class="fixed top-0 left-0 right-0 z-40 flex justify-between items-center px-4 sm:px-8 py-3 pointer-events-none">
    <div class="bg-white/80 backdrop-blur-sm px-3.5 py-1.5 rounded-full shadow-sm border border-amber-900/15 pointer-events-auto flex items-center gap-2">
      <span class="text-base">📚</span>
      <span class="text-xs sm:text-sm font-bold text-amber-950">我的小遊戲書櫃</span>
    </div>

    <div class="flex items-center gap-2 pointer-events-auto">
      <button id="soundBtn" class="bg-white/80 hover:bg-white px-3 py-1.5 rounded-full text-xs font-bold text-amber-950 shadow-sm border border-amber-900/15 transition">
        🔊 音效開
      </button>
    </div>
  </header>

  <!-- 房間主舞台 -->
  <div class="room-scene pt-16 px-4">

    <!-- 整合家具舞台：將時鐘、開關、茶几與書櫃綁定在同一個座標系，手機上自動等比例縮放，絕不重疊 -->
    <div id="furnitureStage" class="furniture-stage">

      <!-- 牆壁同步指針時鐘 (與使用者系統時間即時同步) -->
      <div id="wallClock" class="wall-clock" title="點擊查看現在時間">
        <svg id="clockSvg" width="100%" height="100%" viewBox="0 0 100 100">
          <!-- 12 個整點刻度 -->
          <line x1="50" y1="8" x2="50" y2="15" stroke="#381005" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="92" y1="50" x2="85" y2="50" stroke="#381005" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="50" y1="92" x2="50" y2="85" stroke="#381005" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="8" y1="50" x2="15" y2="50" stroke="#381005" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="71" cy="14" r="1.8" fill="#7d4406"/>
          <circle cx="86" cy="29" r="1.8" fill="#7d4406"/>
          <circle cx="86" cy="71" r="1.8" fill="#7d4406"/>
          <circle cx="71" cy="86" r="1.8" fill="#7d4406"/>
          <circle cx="29" cy="86" r="1.8" fill="#7d4406"/>
          <circle cx="14" cy="71" r="1.8" fill="#7d4406"/>
          <circle cx="14" cy="29" r="1.8" fill="#7d4406"/>
          <circle cx="29" cy="14" r="1.8" fill="#7d4406"/>
          <!-- 時針、分針、秒針 -->
          <line id="clockHour" x1="50" y1="50" x2="50" y2="27" stroke="#381005" stroke-width="4.5" stroke-linecap="round"/>
          <line id="clockMinute" x1="50" y1="50" x2="50" y2="18" stroke="#522927" stroke-width="3" stroke-linecap="round"/>
          <line id="clockSecond" x1="50" y1="56" x2="50" y2="14" stroke="#d61f1f" stroke-width="1.8" stroke-linecap="round"/>
          <!-- 中心軸心 -->
          <circle cx="50" cy="50" r="3.5" fill="#381005"/>
        </svg>
      </div>

      <!-- 牆壁電燈開關 (點一下切換關燈夜讀模式) -->
      <button id="wallSwitchBtn" class="wall-switch" title="牆壁電燈開關">
        <div class="w-1 h-1 rounded-full bg-neutral-400 mb-1"></div>
        <div class="switch-rocker"></div>
        <div class="w-1 h-1 rounded-full bg-neutral-400 mt-1"></div>
      </button>

      <!-- 電燈開關正下方的「円」字型小茶几 + 熱可可馬克杯 -->
      <div class="side-table-group">
        <!-- 放在茶几上的熱可可馬克杯 (放大尺寸以符合書本與玩偶比例) -->
        <div id="decor-mug" class="decor-item -mb-1.5 z-10" title="熱可可馬克杯">
          <svg width="62" height="65" viewBox="0 0 44 46" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- 熱氣 -->
            <path class="steam-line" d="M15 14 C13 10 17 7 15 3" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
            <path class="steam-line-delay" d="M23 13 C21 9 25 6 23 2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
            <!-- 杯把 -->
            <path d="M30 24 H35 C38 24 39 27 39 30 C39 33 38 36 35 36 H30" stroke="#e05a47" stroke-width="3.5" stroke-linecap="round"/>
            <!-- 杯身 -->
            <rect x="8" y="19" width="23" height="25" rx="3" fill="#ff7661" stroke="#9e2f20" stroke-width="2.2"/>
            <ellipse cx="19.5" cy="20" rx="10.5" ry="2.5" fill="#5c2c0c"/>
            <!-- 杯身小愛心 -->
            <circle cx="19.5" cy="31" r="3" fill="#fff3e6"/>
          </svg>
        </div>

        <!-- 長得像「円」字的小茶几 (放大至超過牆面踢腳板高度，與書櫃比例一致) -->
        <svg width="118" height="172" viewBox="0 0 78 112" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-lg">
          <!-- 「円」的門框結構：左桌腳 + 頂部桌面 + 右桌腳 -->
          <path d="M9 112 V12 C9 7.5 12.5 4 17 4 H61 C65.5 4 69 7.5 69 12 V112" 
                stroke="#381005" stroke-width="11" stroke-linecap="butt" stroke-linejoin="round"/>
          <!-- 桌面頂緣木頭高光線 (呼應書櫃層板質感) -->
          <line x1="12" y1="1" x2="66" y2="1" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
          <!-- 「円」中間的橫向隔板 (一) -->
          <rect x="13" y="46" width="52" height="9" fill="#381005"/>
          <line x1="14" y1="46.5" x2="64" y2="46.5" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
          <!-- 「円」中間的垂直小立柱 (丨) -->
          <rect x="35" y="9" width="8" height="38" fill="#7d4406" stroke="#381005" stroke-width="2"/>
        </svg>
      </div>

      <!-- ==========================================
           核心四層木書櫃 (由 JS 自動根據陣列渲染)
           ========================================== -->
      <div id="bookcaseContainer" class="bookcase shrink-0">
        <!-- 書櫃頂端擺飾：柔和手繪風打盹小橘貓 (與泰迪熊同款暖褐手繪描邊) -->
        <div class="absolute bottom-full left-0 right-0 flex justify-end items-end px-5 -mb-[2px] pointer-events-none">
          <div id="decor-cat" class="decor-item pointer-events-auto" title="打盹的小橘貓">
            <svg width="116" height="68" viewBox="0 0 124 72" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- 帶白尖與手繪描邊的搖擺尾巴 -->
              <g class="cat-tail">
                <path d="M94 60 C108 60 116 49 111 41 C107 35 100 38 102 44" stroke="#5c2c0c" stroke-width="13" stroke-linecap="round"/>
                <path d="M94 60 C108 60 116 49 111 41 C107 35 100 38 102 44" stroke="#f59b42" stroke-width="8" stroke-linecap="round"/>
                <path d="M107 38 C103 36 100 39 102 44" stroke="#fff4e6" stroke-width="7.5" stroke-linecap="round"/>
              </g>
              <!-- 頭身一體成形的軟綿綿趴睡輪廓 (消除幾何拼接線條) -->
              <path d="M18 68 C11 66 10 50 18 40 C15 28 19 20 24 20 C28 20 31 26 33 31 Q39 29.5 45 31 C47 26 50 20 54 20 C59 20 63 28 59 39 C77 32 101 40 102 63 C102 67 97 68 92 68 Z" 
                    fill="#f59b42" stroke="#5c2c0c" stroke-width="2.6" stroke-linejoin="round"/>
              <!-- 粉嫩內耳 -->
              <path d="M21 31 C20 25 22 23 24 23 C26 23 28 26 29 31 Z" fill="#f7b29c"/>
              <path d="M49 31 C50 26 52 23 54 23 C56 23 58 25 57 31 Z" fill="#f7b29c"/>
              <!-- 額頭與背部的微彎虎斑條紋 -->
              <path d="M36 31 Q37 35 36.5 37 M39.5 30.5 Q40 35 39.5 37.5 M43 31 Q42.5 35 42 37" stroke="#c96514" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M68 37 Q70 43 68 47 M76 38 Q78 44 76 48 M84 41 Q86 47 84 51" stroke="#c96514" stroke-width="3" stroke-linecap="round"/>
              <!-- 彎彎睡眼 -->
              <path d="M25 46 Q29 49.5 33 46" stroke="#4a2103" stroke-width="2.3" stroke-linecap="round"/>
              <path d="M45 46 Q49 49.5 53 46" stroke="#4a2103" stroke-width="2.3" stroke-linecap="round"/>
              <!-- 小粉鼻與 ω 貓嘴 -->
              <ellipse cx="39" cy="50" rx="2.3" ry="1.6" fill="#ff7a85"/>
              <path d="M35 52.5 Q37 55 39 52.5 Q41 55 43 52.5" stroke="#4a2103" stroke-width="1.9" stroke-linecap="round" fill="none"/>
              <!-- 腮紅與小鬍鬚 -->
              <ellipse cx="23" cy="50" rx="3.4" ry="2" fill="#ff9aa2" opacity="0.8"/>
              <ellipse cx="55" cy="50" rx="3.4" ry="2" fill="#ff9aa2" opacity="0.8"/>
              <path d="M16 48 L8 46.5 M16 52 L8 53.5" stroke="#5c2c0c" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M62 48 L70 46.5 M62 52 L70 53.5" stroke="#5c2c0c" stroke-width="1.7" stroke-linecap="round"/>
              <!-- 揣在下巴底下的白手套小肉球 -->
              <path d="M25 68 C25 62.5 34 62.5 35 68 Z" fill="#fff6eb" stroke="#5c2c0c" stroke-width="2" stroke-linejoin="round"/>
              <path d="M43 68 C44 62.5 53 62.5 53 68 Z" fill="#fff6eb" stroke="#5c2c0c" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <!-- 右側裝飾小木栓 (草圖細節) -->
        <div class="cabinet-peg" style="top: 132px;"></div>
        <div class="cabinet-peg" style="top: 264px;"></div>

        <!-- 四層書架將由 JS 生成於此 -->
        <div id="shelvesMount"></div>
      </div>

      <!-- ==========================================
           草圖右側說明框 (滑鼠移到書上才顯示，移開即消失)
           採用絕對定位，不佔排版空間，書櫃穩穩站在地板上
           ========================================== -->
      <div id="calloutBox" 
           class="callout-card callout-hidden fixed lg:absolute top-16 lg:top-16 left-1/2 -translate-x-1/2 lg:translate-x-0 lg:left-[525px] w-64 sm:w-72 lg:w-64 p-4 rounded-sm">
        <!-- 遊戲標題 -->
        <h2 id="infoTitle" class="text-xl font-black text-center text-neutral-800 tracking-wide">
          猜數字
        </h2>
        <!-- 草圖中的粗灰底線 -->
        <div class="callout-divider"></div>

        <!-- 遊戲說明內文 -->
        <p id="infoDesc" class="text-sm text-neutral-700 leading-relaxed text-center font-medium py-1">
          說明...
        </p>

        <div id="infoHint" class="mt-3 pt-2 border-t border-neutral-100 text-[11px] text-neutral-400 text-center">
          ✨ 點擊書本直接開始遊戲
        </div>

    /* ==========================================================
       2. 輕量音效合成器 (Web Audio API，免外部音檔)
       ========================================================== */
    let audioCtx = null;

    // 解鎖瀏覽器自動播放限制：只要使用者在頁面上有第一次點擊或觸控，就喚醒音效引擎
    function unlockAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    window.addEventListener('pointerdown', unlockAudioContext, { once: true });
    window.addEventListener('keydown', unlockAudioContext, { once: true });

    function playPopSound(freq = 480, duration = 0.06) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + duration);

        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {}
    }

    // 產生一套書的 HTML (直接做成 <a> 超連結，點書即進入遊戲)

        let labelHTML = '';

          labelHTML = `
            <div class="flex justify-between w-3/5 h-[68%]">
              <div class="spine-label-thin !h-full"></div>

        } else if (game.labelType === 'thick') {
          labelHTML = `<div class="spine-label-thick"></div>`;
        } else {
          labelHTML = `<div class="spine-label-thin"></div>`;
        }

        return `
          <div class="book-spine" 
               data-book-index="${idx}"
               style="width: ${b.w}px; height: ${b.h}px; background-color: ${game.color};">
            ${labelHTML}
          </div>
        `;
      }).join('');

      return `
        <a id="bookset-${game.id}" 
           href="${game.url}"
           class="book-set" 
           data-game-id="${game.id}"
           aria-label="${game.title}">
          ${booksHTML}
        </a>
      `;
    }

    /* ==========================================================
       4. 綁定滑鼠移入顯示說明框、移出隱藏，以及擺飾點擊動畫
       ========================================================== */
    function bindBookEvents() {
      const isTouchDevice = () => window.matchMedia('(hover: none)').matches;

      document.querySelectorAll('.book-set').forEach(el => {
        const gameId = el.getAttribute('data-game-id');

        // 電腦滑鼠移過去：顯示說明視窗與折線
        el.addEventListener('mouseenter', () => {
          if (isTouchDevice()) return;
          playPopSound(540, 0.05);
          showGameCallout(gameId, false);
        });

        // 電腦滑鼠移走：隱藏說明視窗與折線
        el.addEventListener('mouseleave', () => {
          if (isTouchDevice()) return;
          hideGameCallout();
        });

        // 點擊書本：電腦直接跳轉；手機點第一下先看說明，點第二下才進入遊戲
        el.addEventListener('click', (e) => {
          if (isTouchDevice() && hoveredGameId !== gameId) {
            e.preventDefault();
            playPopSound(540, 0.05);
            document.querySelectorAll('.book-set').forEach(b => b.classList.remove('active-touch'));
            el.classList.add('active-touch');
            showGameCallout(gameId, true);
            return;
          }
          playPopSound(360, 0.08);
        });
      });

      // 手機版點擊書櫃外的空白處時，收起說明視窗
      document.addEventListener('pointerdown', (e) => {
        if (!e.target.closest('.book-set') && hoveredGameId) {
          document.querySelectorAll('.book-set').forEach(b => b.classList.remove('active-touch'));
          hideGameCallout();
        }
      });

      // 鬱金香點擊效果
      const flowerPot = document.getElementById('decor-tulip');
      let tulipClicks = 0;
      if (flowerPot) {
        flowerPot.addEventListener('click', () => {
          tulipClicks++;
          playPopSound(680 + Math.min(tulipClicks * 20, 200), 0.1);
          triggerWiggle(flowerPot);
          if (tulipClicks === 1) {
            showToast("🌷 小鬱金香朝你點了點頭！");
          } else if (tulipClicks === 5) {
            showToast("🌿 澆水太多啦，鬱金香已經精神百倍了！");
          } else {
            showToast(`🌷 鬱金香開心地搖擺中（已互動 ${tulipClicks} 次）`);
          }
        });
      }

      // 泰迪熊點擊效果 (支援多次點擊彩蛋)
      const teddyBear = document.getElementById('decor-teddy');
      let teddyClicks = 0;
      if (teddyBear) {
        teddyBear.addEventListener('click', () => {
          teddyClicks++;
          playPopSound(420, 0.12);
          triggerWiggle(teddyBear);
          if (teddyClicks === 1) {
            showToast("🧸 泰迪熊開心地晃了晃耳朵！");
          } else if (teddyClicks === 3) {
            showToast("🧸 泰迪熊：「今天想玩哪一本書呢？」");
          } else if (teddyClicks === 5) {
            showToast("😵‍💫 泰迪熊被你戳了 5 下，頭都有點暈啦！");
          } else if (teddyClicks >= 10) {
            showToast(`🏆 泰迪熊忠實粉絲達成！（已戳了 ${teddyClicks} 下）`);
          } else {
            showToast(`🧸 泰迪熊搖搖頭（已戳 ${teddyClicks} 下）`);
          }
        });
      }

      // 書櫃頂端：打盹小橘貓點擊效果
      const catEl = document.getElementById('decor-cat');
      let catClicks = 0;
      if (catEl) {
        catEl.addEventListener('click', () => {
          catClicks++;
          // 模擬可愛的貓叫滑音
          playPopSound(760, 0.14);
          setTimeout(() => playPopSound(620, 0.16), 90);
          triggerWiggle(catEl);
          if (catClicks === 1) {
            showToast("🐱 喵嗚～小橘貓翻了個身繼續打盹");
          } else if (catClicks === 4) {
            showToast("💤 呼嚕呼嚕...這隻貓已經進入深度放空模式");
          } else {
            showToast(`🐾 摸了小橘貓第 ${catClicks} 下，呼嚕聲變大了！`);
          }
        });
      }

      // 書櫃頂端：熱可可馬克杯點擊效果
      const mugEl = document.getElementById('decor-mug');
      if (mugEl) {
        mugEl.addEventListener('click', () => {
          playPopSound(880, 0.08);
          triggerWiggle(mugEl);
          showToast("☕ 喝一口熱可可，休息一下再玩吧！");
        });
      }

      // 牆壁電燈開關：切換深夜關燈聚光燈模式
      const switchBtn = document.getElementById('wallSwitchBtn');
      if (switchBtn) {
        switchBtn.addEventListener('click', () => {
          const isDark = document.body.classList.toggle('lights-off');
          playPopSound(isDark ? 260 : 520, 0.05);
          showToast(isDark ? "🌙 已關燈：開啟深夜專注玩遊戲模式" : "☀️ 已開燈：房間恢復明亮！");
        });
      }

      // 牆壁指針時鐘點擊：報時並發出滴答聲
      const clockEl = document.getElementById('wallClock');
      if (clockEl) {
        clockEl.addEventListener('click', () => {
          playPopSound(920, 0.05);
          setTimeout(() => playPopSound(740, 0.05), 110);
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          const ss = String(now.getSeconds()).padStart(2, '0');
          showToast(`🕒 現在時間是 ${hh}:${mm}:${ss}`);
        });
      }
    }

    // 即時同步使用者系統時間，更新時針、分針、秒針角度
    function updateWallClock() {
      const hourHand = document.getElementById('clockHour');
      const minHand = document.getElementById('clockMinute');
      const secHand = document.getElementById('clockSecond');
      if (!hourHand || !minHand || !secHand) return;

      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours() % 12;

      const secDeg = seconds * 6;
      const minDeg = minutes * 6 + seconds * 0.1;
      const hourDeg = hours * 30 + minutes * 0.5;

      secHand.setAttribute('transform', `rotate(${secDeg} 50 50)`);
      minHand.setAttribute('transform', `rotate(${minDeg} 50 50)`);
      hourHand.setAttribute('transform', `rotate(${hourDeg} 50 50)`);
    }

    function triggerWiggle(el) {
      el.classList.remove('wiggling');
      void el.offsetWidth;
      el.classList.add('wiggling');
    }

    // 根據 ID 找到對應的遊戲物件
    function findGameObj(id) {
      for (const row of SHELF_DATA) {
        for (const item of row) {
          if (item.id === id) return item;
        }
      }
      return null;
    }

    // 顯示右側說明框與折線
    function showGameCallout(gameId, isTouch = false) {
      const game = findGameObj(gameId);
      if (!game) return;

      hoveredGameId = gameId;

      document.getElementById('infoTitle').textContent = game.title;
      document.getElementById('infoDesc').textContent = game.desc;
      document.getElementById('infoHint').textContent = isTouch
        ? '👆 再點一次這套書開始遊戲'
        : '✨ 點擊書本直接開始遊戲';

      const calloutBox = document.getElementById('calloutBox');
      const svgOverlay = document.getElementById('leaderLineSvg');

      calloutBox.classList.remove('callout-hidden');
      calloutBox.classList.add('callout-visible');
      svgOverlay.classList.remove('opacity-0');

      requestAnimationFrame(updateLeaderLine);
    }

    // 隱藏右側說明框與折線
    function hideGameCallout() {
      hoveredGameId = null;
      const calloutBox = document.getElementById('calloutBox');
      const svgOverlay = document.getElementById('leaderLineSvg');

      calloutBox.classList.remove('callout-visible');
      calloutBox.classList.add('callout-hidden');
      svgOverlay.classList.add('opacity-0');
    }

    // 動態計算座標並畫出草圖中的「Z 字型灰色引出線」
    function updateLeaderLine() {
      const polyline = document.getElementById('leaderPolyline');
      const startDot = document.getElementById('leaderStartDot');
      if (!hoveredGameId) return;

      const activeSetEl = document.getElementById(`bookset-${hoveredGameId}`);
      const calloutEl = document.getElementById('calloutBox');

      if (!activeSetEl || !calloutEl) return;

      // 在窄螢幕 (手機/平板直立) 下隱藏跨畫面折線
      if (window.innerWidth < 1024) {
        polyline.setAttribute('points', '');
        startDot.setAttribute('cx', '-20');
        startDot.setAttribute('cy', '-20');
        return;
      }

      const spines = activeSetEl.querySelectorAll('.book-spine');
      const anchorSpine = spines.length > 1 ? spines[spines.length - 2] : spines[0];
      const bookRect = (anchorSpine || activeSetEl).getBoundingClientRect();
      const boxRect = calloutEl.getBoundingClientRect();

      // 起點 (x1, y1)：書本下半部偏右處
      const x1 = bookRect.left + bookRect.width * 0.55;
      const y1 = bookRect.top + bookRect.height * 0.72;

      // 終點 (x4, y4)：右側說明白框的左側邊緣偏上方
      const x4 = boxRect.left;
      const y4 = boxRect.top + 45;

      // 中間轉折點 X：在書櫃右緣與說明框左緣之間折彎
      const bookcaseRect = document.getElementById('bookcaseContainer').getBoundingClientRect();
      const midX = bookcaseRect.right + (x4 - bookcaseRect.right) * 0.52;

      const pointsStr = `${x1},${y1} ${midX},${y1} ${midX},${y4} ${x4},${y4}`;
      polyline.setAttribute('points', pointsStr);

      startDot.setAttribute('cx', x1);
      startDot.setAttribute('cy', y1);
    }

    /* ==========================================================
       5. 介面輔助功能 (Toast、音效開關、視窗縮放監聽)
       ========================================================== */
    let toastTimer = null;
    function showToast(text) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = text;
      toast.style.opacity = '1';
      toast.style.transform = 'translate(-50%, -6px)';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, 0)';
      }, 2400);
    }

    // 音效開關
    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? '🔊 音效開' : '🔇 音效關';
      if (soundOn) playPopSound(520, 0.06);
    });

    // 動態計算手機螢幕寬度，將整組家具舞台（時鐘+開關+茶几+書櫃）等比例縮放，確保完全不重疊
    function fitStageToScreen() {
      const stage = document.getElementById('furnitureStage');
      if (!stage) return;
      const vw = window.innerWidth;
      const stageWidth = 500; // 舞台基準總寬度
      if (vw < stageWidth + 24) {
        const scale = Math.max(0.55, (vw - 16) / stageWidth);
        stage.style.transform = `scale(${scale})`;
      } else {
        stage.style.transform = 'scale(1)';
      }
    }

    // 當視窗縮放或滾動時，即時更新舞台縮放比例與折線座標
    window.addEventListener('resize', () => {
      fitStageToScreen();
      if (hoveredGameId) updateLeaderLine();
    });
    window.addEventListener('scroll', () => {
      if (hoveredGameId) updateLeaderLine();
    }, { passive: true });

    // 初始化啟動
    window.addEventListener('DOMContentLoaded', () => {
      renderBookcase();
      fitStageToScreen();
      updateWallClock();
      setInterval(updateWallClock, 1000);
    });
  </script>
</body>
</html>
