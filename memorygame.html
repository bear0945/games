<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script data-goatcounter="https://bear0945.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>配對遊戲</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;background:linear-gradient(135deg,#fce4ec,#f8bbd9);color:#333;
  display:flex;justify-content:center;align-items:flex-start;touch-action:manipulation;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.container{width:100%;max-width:460px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(233,30,99,.2);margin:auto 0}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{background:#2196f3;width:34px;height:34px;border-radius:6px;display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:7px}
.logo-icon i{background:#fff;border-radius:2px}
h1{margin:0;font-size:21px}
.btn{border:0;color:#fff;border-radius:14px;font:inherit;font-size:14px;font-weight:bold;cursor:pointer;padding:9px 16px;background:linear-gradient(145deg,#d48ca8,#c77a96);box-shadow:3px 3px 6px rgba(0,0,0,.2);touch-action:manipulation}
.btn:active{transform:scale(.97);box-shadow:inset 2px 2px 4px rgba(0,0,0,.25)}
.btn.main{background:linear-gradient(145deg,#ec407a,#c2185b)}
.btn:focus-visible,.seg:focus-visible,.card:focus-visible{outline:3px solid #880e4f;outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cap{width:34px;flex:none;font-size:12px;font-weight:bold;color:#c2185b}
.segs{display:flex;flex:1;border:2px solid #e91e63;border-radius:12px;overflow:hidden}
.seg{flex:1;min-width:0;border:0;background:#fff;color:#c2185b;font:inherit;font-size:13px;padding:7px 0;cursor:pointer;white-space:nowrap}
.seg[aria-checked=true]{background:#e91e63;color:#fff;font-weight:bold}
.stats{display:flex;gap:6px;margin:12px 0}
.stat{flex:1;text-align:center;background:#fce4ec;border-radius:12px;padding:4px 2px;font-size:12px;font-weight:bold;color:#c2185b}
.stat b{display:block;font-size:18px;line-height:22px;color:#333;font-variant-numeric:tabular-nums}
.stat b.sm{font-size:15px}
.stat.warn b{color:#d32f2f;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.board{display:grid;gap:8px;margin:0 auto;width:100%}
.board.c3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:270px}
.board.c4{grid-template-columns:repeat(4,minmax(0,1fr));max-width:380px}
.card{aspect-ratio:1;min-width:0;border:0;padding:0;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;
  font-size:clamp(24px,8.5vw,38px);transition:transform .15s,background .2s,box-shadow .2s;touch-action:manipulation;line-height:1}
.board.c4.dense .card{font-size:clamp(22px,7.5vw,34px)}
.card.back{background:linear-gradient(145deg,#d48ca8,#c77a96);color:#fff;font-weight:bold;box-shadow:3px 3px 6px rgba(0,0,0,.2)}
.card.flipped{background:#fff;box-shadow:0 0 0 3px #f8bbd9,0 3px 6px rgba(0,0,0,.15);transform:scale(.96)}
.card.matched{background:#e8f5e9;box-shadow:0 0 0 3px #a5d6a7;transform:scale(.94);cursor:default}
.card.locked{cursor:default}
@media(hover:hover){.card.back:not(.locked):hover{transform:scale(1.05)}}
.ov{position:fixed;inset:0;background:rgba(194,24,91,.25);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.ov.show{display:flex}
.card-ov{background:#fff;border:3px solid #e91e63;border-radius:20px;padding:22px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(233,30,99,.35);animation:pop .3s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card-ov h2{margin:0 0 10px;color:#c2185b}
.card-ov p{margin:6px 0 16px;color:#666;line-height:1.6}
.card-ov .btn{margin:4px;padding:11px 18px;font-size:15px}
@media(prefers-reduced-motion:reduce){.card-ov,.stat.warn b{animation:none}.card{transition:none}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo"><div class="logo-icon"><i></i><i></i><i></i><i></i></div><h1>配對遊戲</h1></div>
    <button class="btn main" id="restartBtn">重新開始</button>
  </header>

  <div class="row"><span class="cap">格數</span>
    <div class="segs" id="sizeSegs" role="radiogroup" aria-label="格數">
      <button class="seg" role="radio" data-v="12">12格</button>
      <button class="seg" role="radio" data-v="16">16格</button>
      <button class="seg" role="radio" data-v="20">20格</button>
    </div>
  </div>
  <div class="row"><span class="cap">難度</span>
    <div class="segs" id="diffSegs" role="radiogroup" aria-label="難度">
      <button class="seg" role="radio" data-v="normal">普通</button>
      <button class="seg" role="radio" data-v="hard">困難</button>
      <button class="seg" role="radio" data-v="expert">專家</button>
      <button class="seg" role="radio" data-v="nightmare">夢魘</button>
    </div>
  </div>
  <div class="row" id="typeRow" hidden><span class="cap">類型</span>
    <div class="segs" id="typeSegs" role="radiogroup" aria-label="夢魘模式類型">
      <button class="seg" role="radio" data-v="similar">相似符號</button>
      <button class="seg" role="radio" data-v="animals">動物臉</button>
      <button class="seg" role="radio" data-v="fruits">水果</button>
      <button class="seg" role="radio" data-v="sweets">甜點</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat">步數<b id="moves">0</b></div>
    <div class="stat">配對<b><span id="pairs">0</span>/<span id="total">6</span></b></div>
    <div class="stat" id="timeBox">時間<b id="time">不限時</b></div>
  </div>

  <div class="board c3" id="board" role="grid" aria-label="牌桌"></div>
</div>

<div class="ov" id="ov">
  <div class="card-ov">
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <button class="btn main" id="againBtn">再玩一次</button>
    <button class="btn" id="closeBtn">看牌面</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const EMOJIS = ['🌸','🦄','🌙','⭐','🍓','🌈','🦋','🌺','🍒','🎀','💎','🧸','🍰','🌻','🐱','🎈','🍭','🎪','🎯','🎨','🎵','⚡','🔮','🍄','🎭','🌊'];
const NIGHTMARE = {
    similar: ['🌸','🌺','😀','😃','⭐','✨','🌙','🌛','❤️','💕','🔵','🔴','🎈','🎁','🍎','🍒','🦋','🐛','👁️','👀','💫','⚡','🌻','🌼','🎯','⚽'],
    animals: ['🐶','🐱','🐭','🐹','🦊','🐻','🐼','🐷','🐺','🦝'],
    fruits: ['🍏','🍎','🍐','🍊','🍋','🍓','🍍','🍇','🍑','🥭'],
    sweets: ['🍩','🍬','🍭','🍮','🧁','🍦','🍨','🍫','🍪','🎂']
};
const SETTINGS = {
    normal:    { flipTime: 1000, timeLimit: null, previewTime: 2000 },
    hard:      { flipTime: 800,  timeLimit: 120,  previewTime: 1500 },
    expert:    { flipTime: 600,  timeLimit: 90,   previewTime: 1000 },
    nightmare: { flipTime: 500,  timeLimit: 60,   previewTime: 500 }
};
const NAMES = { normal: '普通', hard: '困難', expert: '專家', nightmare: '夢魘' };

let size = 12, diff = 'normal', nType = 'similar';
let cards = [], els = [], flipped = [], pairs = 0, moves = 0;
let ended = false, locked = true, timeLeft = null, timerId = 0, startAt = 0, gid = 0;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmt = t => (t / 60 | 0) + ':' + String(t % 60).padStart(2, '0');

function init() {
    gid++; const id = gid;          // 每一局一個編號：上一局還沒跑完的計時器，發現編號不同就直接作廢
    clearInterval(timerId);
    const st = SETTINGS[diff], set = diff === 'nightmare' ? NIGHTMARE[nType] : EMOJIS;
    const pick = set.slice(0, size / 2);
    cards = shuffle(pick.concat(pick)).map((e, i) => ({ id: i, emoji: e, flipped: true, matched: false })); // 開局先全部翻開讓你記牌
    flipped = []; pairs = 0; moves = 0; ended = false; locked = true; startAt = Date.now();
    $('ov').classList.remove('show');
    timeLeft = st.timeLimit;
    $('timeBox').classList.remove('warn');
    $('time').textContent = timeLeft === null ? '不限時' : fmt(timeLeft);
    $('time').classList.toggle('sm', timeLeft === null);
    stats(); build(); render();
    setTimeout(() => {
        if (id !== gid) return;
        cards.forEach(c => c.flipped = false); locked = false; render();
    }, st.previewTime);
    if (st.timeLimit) timerId = setInterval(() => {
        if (ended) return;
        timeLeft--;
        $('time').textContent = fmt(timeLeft);
        if (timeLeft <= 10) $('timeBox').classList.add('warn');
        if (timeLeft <= 0) lose();
    }, 1000);
}

function build() {
    const b = $('board');
    b.className = 'board ' + (size === 12 ? 'c3' : 'c4') + (size === 20 ? ' dense' : '');
    b.innerHTML = ''; els = [];
    cards.forEach((c, i) => {
        const e = document.createElement('button');
        e.type = 'button'; e.setAttribute('role', 'gridcell');
        e.onclick = () => pick(i);
        b.appendChild(e); els.push(e);
    });
}

function pick(i) {
    const c = cards[i];
    if (locked || ended || c.flipped || c.matched) return;
    c.flipped = true; flipped.push(c); render();
    if (flipped.length < 2) return;
    moves++; stats(); locked = true;
    const [a, b] = flipped, id = gid;
    if (a.emoji === b.emoji) {
        setTimeout(() => {
            if (id !== gid || ended) return;
            a.matched = b.matched = true; pairs++; flipped = []; locked = false; render(); stats();
            if (pairs === size / 2) win();
        }, 500);
    } else {
        setTimeout(() => {
            if (id !== gid || ended) return;
            a.flipped = b.flipped = false; flipped = []; locked = false; render();
        }, SETTINGS[diff].flipTime);
    }
}

function render() {
    cards.forEach((c, i) => {
        const e = els[i], open = c.flipped || c.matched;
        e.className = 'card ' + (c.matched ? 'matched' : c.flipped ? 'flipped' : 'back') + (locked || ended ? ' locked' : '');
        e.textContent = open ? c.emoji : '?';
        e.setAttribute('aria-label', open ? c.emoji : '蓋著的牌');
    });
}
function stats() { $('moves').textContent = moves; $('pairs').textContent = pairs; $('total').textContent = size / 2; }

function show(title, text) { $('ovTitle').textContent = title; $('ovText').textContent = text; $('ov').classList.add('show'); }
function win() {
    ended = true; clearInterval(timerId); render();
    const sec = Math.floor((Date.now() - startAt) / 1000);
    show('🎉 恭喜完成！', `你用了 ${moves} 步、${sec} 秒完成了「${NAMES[diff]}」模式！`);
}
function lose() {
    ended = true; clearInterval(timerId); render();
    show('⏰ 時間到了！', `你配對了 ${pairs}/${size / 2} 組，再試一次吧！`);
}

/* ---------- 選項 ---------- */
function bindSegs(groupId, get, set) {
    const g = $(groupId), btns = [...g.querySelectorAll('.seg')];
    const sync = () => btns.forEach(b => b.setAttribute('aria-checked', b.dataset.v === String(get())));
    btns.forEach(b => b.onclick = () => { set(b.dataset.v); sync(); init(); });
    sync();
}
bindSegs('sizeSegs', () => size, v => size = +v);
bindSegs('diffSegs', () => diff, v => { diff = v; $('typeRow').hidden = v !== 'nightmare'; });
bindSegs('typeSegs', () => nType, v => nType = v);
$('restartBtn').onclick = init;
$('againBtn').onclick = init;
$('closeBtn').onclick = () => $('ov').classList.remove('show');
$('ov').onclick = e => { if (e.target === $('ov')) $('ov').classList.remove('show'); }; // 點視窗外面也能關

init();
</script>
</body>
</html>
